<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Async Job Dashboard</title>
<style>
  :root { font-family: system-ui, Segoe UI, sans-serif; color:#25364a; background:#f4f7fb; }
  body { max-width: 760px; margin: 45px auto; padding: 0 20px; }
  h1 { margin-bottom: 4px; } p { color:#5f6c7b; }
  section { background:white; border:1px solid #d9e3ef; border-radius:12px; padding:24px; margin-top:24px; }
  form { display:flex; gap:10px; }
  input { flex:1; padding:12px; border:1px solid #b8c8d8; border-radius:7px; min-width:0; }
  button { border:0; background:#336b87; border-radius:7px; padding:12px 18px; color:white; cursor:pointer; }
  button:disabled { opacity:.5; } .job { padding:12px 0; border-bottom:1px solid #e9edf2; }
  .job:last-child {border-bottom:0;} .job small {display:block; color:#67778b; overflow-wrap:anywhere; margin-top:6px;}
  .status {font-weight:650;} .completed {color:#138357;} .failed {color:#bb3845;} .processing {color:#2367b5;} .queued {color:#806018;}
  #message {min-height:20px;}
</style>
</head>
<body>
<h1>Event-Driven Job Dashboard</h1>
<p>FastAPI accepts each job immediately. A RabbitMQ worker processes it independently.</p>
<section>
  <h2>Submit a job</h2>
  <form id="form"><input id="task" required maxlength="200" placeholder="e.g. Generate weekly report" aria-label="Job description"><button id="submit">Submit job</button></form>
  <p id="message" role="status"></p>
  <p><small>Test retries with <code>retry: example</code> or permanent failure with <code>fail: example</code>.</small></p>
</section>
<section><h2>Recent submitted jobs</h2><div id="jobs">No jobs submitted yet.</div></section>
<script>
const form = document.querySelector('#form');
const jobsEl = document.querySelector('#jobs');
const statusMsg = document.querySelector('#message');
const jobs = new Map();
form.addEventListener('submit', async event => {
  event.preventDefault();
  const button = document.querySelector('#submit');
  button.disabled = true;
  statusMsg.textContent = '';
  try {
    const res = await fetch('/api/jobs', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({task:document.querySelector('#task').value})});
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Submission failed');
    jobs.set(data.job_id, {id:data.job_id, task:document.querySelector('#task').value, status:data.status, attempts:0});
    document.querySelector('#task').value = '';
    statusMsg.textContent = `Accepted job ${data.job_id}`;
    render();
    refresh();
  } catch (err) { statusMsg.textContent = err.message; }
  finally { button.disabled = false; }
});
function render() {
  jobsEl.replaceChildren();
  if (!jobs.size) {jobsEl.textContent='No jobs submitted yet.'; return;}
  for (const job of [...jobs.values()].reverse()) {
    const card = document.createElement('div'); card.className='job';
    const title=document.createElement('strong'); title.textContent=job.task;
    const status=document.createElement('div'); status.className='status '+job.status; status.textContent=`${job.status.toUpperCase()} · attempts: ${job.attempts}`;
    const details=document.createElement('small'); details.textContent=`Job ID: ${job.id}${job.error?' · '+job.error:''}`;
    card.append(title,status,details);jobsEl.append(card);
  }
}
async function refresh() {
  await Promise.all([...jobs.values()].filter(j=>!['completed','failed'].includes(j.status)).map(async j=>{
    try {const res=await fetch('/api/jobs/'+encodeURIComponent(j.id)); if(res.ok) Object.assign(j,await res.json());} catch {}
  }));
  render();
}
setInterval(refresh, 1000);
</script>
</body>
</html>
